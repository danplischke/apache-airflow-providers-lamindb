---
package-name: apache-airflow-providers-lamindb
name: LaminDB
description: |
    `LaminDB <https://lamin.ai/>`__ lineage for DAG runs and event-driven scheduling via the LaminHub REST API.

state: ready
lifecycle: incubation
versions:
  - 0.0.1
  - 0.1.0

integrations:
  - integration-name: LaminDB
    external-doc-url: https://docs.lamin.ai/
    tags: [service, software]

operators:
  - integration-name: LaminDB
    python-modules:
      - airflow.providers.lamindb.operators.flow

hooks:
  - integration-name: LaminDB
    python-modules:
      - airflow.providers.lamindb.hooks.lamindb

triggers:
  - integration-name: LaminDB
    python-modules:
      - airflow.providers.lamindb.triggers.base
      - airflow.providers.lamindb.triggers.records
      - airflow.providers.lamindb.triggers.branches

sensors:
  - integration-name: LaminDB
    python-modules:
      - airflow.providers.lamindb.sensors.records
      - airflow.providers.lamindb.sensors.branches

connection-types:
  - hook-class-name: airflow.providers.lamindb.hooks.lamindb.LaminDBHook
    hook-name: "LaminDB"
    connection-type: lamindb
    conn-fields:
      instance:
        label: Instance
        description: >-
          LaminDB instance slug in the form ``owner/name`` (for example ``laminlabs/lamindata``).
        schema:
          type:
            - string
            - "null"
      cache_dir:
        label: Cache directory
        description: >-
          Absolute path of a lamindb cache shared by the virtualenv tasks (``LAMIN_CACHE_DIR``),
          e.g. on a shared volume. Empty for lamindb's default.
        schema:
          type:
            - string
            - "null"
    ui-field-behaviour:
      hidden-fields:
        - port
        - login
        - schema
        - extra
      relabeling:
        host: LaminHub API URL
        password: API Key
      placeholders:
        host: https://aws.us-east-1.lamin.ai/api
        password: Lamin API key (leave empty for public instances)
        instance: owner/name
        cache_dir: /shared/lamindb-cache

task-decorators:
  - name: lamindb_virtualenv
    class-name: airflow.providers.lamindb.decorators.python_virtualenv.lamindb_virtualenv_task
  - name: lamindb_kubernetes
    class-name: airflow.providers.lamindb.decorators.kubernetes.lamindb_kubernetes_task

config:
  lamindb:
    description: Settings of the LaminDB provider.
    options:
      setup_class:
        description: |
          Import path of a ``LaminDBSetup`` subclass that prepares the
          virtualenvs and pods of all LaminDB tasks: bootstrap code before
          lamindb is imported, and environment variables resolved when a task
          runs. A ``lamindb_setup`` argument, also in a DAG's ``default_args``,
          overrides it. Empty for none.
        version_added: ~
        type: string
        example: mycompany.airflow.SiteSetup
        default: ""
