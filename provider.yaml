---
package-name: lamindb-airflow
name: LaminDB
description: |
  Map Airflow DAG runs to `LaminDB <https://lamin.ai>`__ flows and tasks to steps.

versions:
  - 0.1.0

integrations:
  - integration-name: LaminDB
    external-doc-url: https://docs.lamin.ai
    tags: [software]

operators:
  - integration-name: LaminDB
    python-modules:
      - airflow.providers.lamindb.operators.flow
      - airflow.providers.lamindb.operators.step

task-decorators:
  - name: lamindb
    class-name: airflow.providers.lamindb.decorators.python.lamindb_task
  - name: lamindb_venv
    class-name: airflow.providers.lamindb.decorators.python_virtualenv.lamindb_venv_task
  - name: lamindb_k8s
    class-name: airflow.providers.lamindb.decorators.kubernetes.lamindb_k8s_task
