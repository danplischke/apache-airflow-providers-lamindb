name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION_DEFAULT: "3.14"

jobs:
  qa:
    name: QA
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/qa.yml

  check-version:
    name: Check tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Compare the tag with provider.yaml and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          provider=$(awk '/^versions:/ { getline; sub(/^ *- */, ""); print; exit }' provider.yaml)
          changelog=$(sed -n 's/^## //p' docs/changelog.md | head -1)
          echo "tag: $ver, provider.yaml: $provider, docs/changelog.md: $changelog"
          [ "$ver" = "$provider" ] && [ "$ver" = "$changelog" ]

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          # hatch-vcs derives the version from the tags
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — https://github.com/actions/setup-python/releases/tag/v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0

      - name: Build package
        run: uv build

      - name: Compare the built version with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls dist/
          test -f "dist/apache_airflow_providers_lamindb-${TAG#v}-py3-none-any.whl"

      - name: Check package
        # twine < 7 rejects newer Metadata-Version values that PyPI accepts.
        run: |
          pip install 'twine>=7.0.0'
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [qa, check-version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    # must match the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/apache-airflow-providers-lamindb
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 — https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.3

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
