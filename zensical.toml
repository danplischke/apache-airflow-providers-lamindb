[project]
site_name = "apache-airflow-providers-lamindb"
site_description = "Apache Airflow provider for LaminDB: tracked tasks, optional DAG-run flows, and DAGs triggered by LaminHub events."
site_author = "Dan Plischke, Andreas Poehlmann"
site_url = "https://danplischke.github.io/apache-airflow-providers-lamindb/"
repo_url = "https://github.com/danplischke/apache-airflow-providers-lamindb"
repo_name = "danplischke/apache-airflow-providers-lamindb"
edit_uri = "edit/main/docs/"
copyright = """
Copyright &copy; Dan Plischke and Andreas Poehlmann. Licensed under the MIT License.<br>
Apache Airflow, Apache, Airflow and the Airflow logo are trademarks of The Apache Software Foundation.
This project is not affiliated with or endorsed by The Apache Software Foundation.
"""

nav = [
  { "Basics" = [
    { "Home" = "index.md" },
    { "Changelog" = "changelog.md" },
  ] },
  { "Guides" = [
    { "Connection types" = [
      { "LaminDB Connection" = "connections/lamindb.md" },
    ] },
    { "Lineage" = "lineage.md" },
    { "Triggers" = "triggers.md" },
    { "Sensors and hook" = "sensors.md" },
    { "Filters" = "filters.md" },
  ] },
  { "References" = [
    { "Python API" = "api.md" },
  ] },
  { "Resources" = [
    { "PyPI Repository" = "https://pypi.org/project/apache-airflow-providers-lamindb/" },
    { "LaminDB" = "https://docs.lamin.ai/" },
  ] },
  { "Commits" = [
    { "Detailed list of commits" = "https://github.com/danplischke/apache-airflow-providers-lamindb/commits/main/" },
  ] },
]

extra_css = ["stylesheets/airflow.css"]

[project.theme]
variant = "classic"
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/database"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/danplischke/apache-airflow-providers-lamindb"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/apache-airflow-providers-lamindb/"

[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
Apache Airflow 3 provider for [LaminDB](https://lamin.ai). It records tasks as LaminDB runs, optionally grouped
under DAG-run flow runs with `LaminDBFlow`, with lamindb running in a virtualenv (`@task.lamindb_venv`) or a Kubernetes pod
(`@task.lamindb_k8s`), never on the worker. Event triggers schedule DAGs on artifacts, records and branches
changing in a LaminHub-hosted instance, and deferrable sensors wait for them inside a DAG. Install with
`pip install apache-airflow-providers-lamindb` (add the `[k8s]` extra for `@task.lamindb_k8s`); it needs
Apache Airflow 3.3.0 or newer and lamindb 2.8.1 or newer.
"""

[project.plugins.llmstxt.sections]
Basics = [
  { "index.md" = "Features, requirements and installation" },
  { "changelog.md" = "Changes per release" },
]
Guides = [
  { "connections/lamindb.md" = "The lamindb connection type: API key, instance, LaminHub API URL, cache directory, templated connection ids" },
  { "lineage.md" = "Tracked tasks and optional flow scopes: @task.lamindb_venv, @task.lamindb_k8s, LaminDBFlow, the flow operators, migration from auto_flow, settings, limitations" },
  { "triggers.md" = "Event-driven scheduling on artifacts, records and branches, delivery guarantees, cursor stores, event payloads" },
  { "sensors.md" = "Deferrable sensors for branches, records and artifacts, and LaminDBHook" },
  { "filters.md" = "Building LaminHub REST filters with F, the field enums and the operators" },
]
Optional = [
  { "api.md" = "Python API reference of LaminDBFlow, the operators, decorators, triggers, sensors, hook, filters and enums" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://airflow.apache.org/docs/apache-airflow/stable/objects.inv",
  "https://airflow.apache.org/docs/task-sdk/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
docstring_section_style = "list"
filters = ["!^_"]
heading_level = 2
members_order = "source"
merge_init_into_class = true
line_length = 88
separate_signature = true
show_root_full_path = true
show_root_heading = true
show_signature_annotations = true
show_source = true
show_symbol_type_heading = true
show_symbol_type_toc = true
relative_crossrefs = true
scoped_crossrefs = true
signature_crossrefs = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = "¶"
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
