[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "lamindb-airflow"
version = "0.1.0"
description = "Apache Airflow 3 provider that maps DAG runs to LaminDB flows and tasks to steps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Plischke" }]
keywords = ["airflow-provider", "lamindb", "airflow", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "apache-airflow>=3.0",
    "apache-airflow-providers-standard",
]

[project.optional-dependencies]
# Only the in-process operators need lamindb on the worker; the venv/k8s variants install it remotely.
"lamindb" = [
    "lamindb",
]
"cncf.kubernetes" = [
    "apache-airflow-providers-cncf-kubernetes",
]

[dependency-groups]
dev = [
    "lamindb-airflow[lamindb,cncf.kubernetes]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
]

[project.urls]
"Source Code" = "https://github.com/danplischke/apache-airflow-providers-lamindb"
"Bug Tracker" = "https://github.com/danplischke/apache-airflow-providers-lamindb/issues"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.lamindb.get_provider_info:get_provider_info"

[tool.flit.module]
name = "airflow.providers.lamindb"

[tool.flit.sdist]
include = [
    "docs/",
    "provider.yaml",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# tests exec generated sources the way the virtualenv/pod script does
"tests/**" = ["S102"]
